server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Legacy content moved to archive.russfeld.me ---------------------------
    location = /teaching/ { return 301 https://archive.russfeld.me/; }
    location = /courses/  { return 301 https://archive.russfeld.me/; }
    rewrite ^/(?:teaching|courses)/cis115fall2016scholars/?.*$ https://archive.russfeld.me/cis115fall2016/scholars/ permanent;
    rewrite ^/(?:teaching|courses)/cis527online/?.*$           https://cis527.russfeld.me/ permanent;
    rewrite ^/(?:teaching|courses)/(cis[0-9a-z]+)/?.*$         https://archive.russfeld.me/$1/ permanent;
    rewrite ^/(?:teaching|courses)/                            https://archive.russfeld.me/ permanent;

    rewrite ^/assets/oldimpress/(cis[0-9a-z]+/.*)$ https://archive.russfeld.me/$1 permanent;
    rewrite ^/assets/oldimpress/((?:css|js)/.*)$   https://archive.russfeld.me/$1 permanent;
    rewrite ^/assets/oldimpress/                   https://archive.russfeld.me/ permanent;

    rewrite ^/projects/openhouse/(intro|intro2015|creativity)\.html$ https://archive.russfeld.me/openhouse/$1.html permanent;
    rewrite ^/talks/lecturetime2021/slides\.html$ https://archive.russfeld.me/presentations/lecturetime2021/ permanent;

    rewrite ^/curriculum/ https://archive.russfeld.me/curriculum/ permanent;

    # Jekyll-era /presentations/<slug>/ (and anything under it).
    rewrite ^/presentations/2013kawse/              https://archive.russfeld.me/presentations/kawse2013/ permanent;
    rewrite ^/presentations/2013mscompsci/          https://archive.russfeld.me/presentations/ms_compsci.html permanent;
    rewrite ^/presentations/2014hourofcode/         https://archive.russfeld.me/presentations/hourofcode/ permanent;
    rewrite ^/presentations/2015ambassador/         https://archive.russfeld.me/presentations/4hambassador2015.html permanent;
    rewrite ^/presentations/2015mscoextension/      https://archive.russfeld.me/presentations/mscoextension/ permanent;
    rewrite ^/presentations/2016acmprogcon/         https://archive.russfeld.me/presentations/acm_progcon.html permanent;
    rewrite ^/presentations/2016gittutorial/        https://archive.russfeld.me/presentations/git_tutorial/ permanent;
    rewrite ^/presentations/2016springcis625final/  https://archive.russfeld.me/presentations/cis625spring2016final/ permanent;
    rewrite ^/presentations/2017cis526bootstrap/    https://archive.russfeld.me/presentations/cis526bootstrap/ permanent;
    rewrite ^/presentations/2017den301creativity/   https://archive.russfeld.me/presentations/den301_creativity/ permanent;
    rewrite ^/presentations/2018computationalthinking/ https://archive.russfeld.me/presentations/computationalthinking/ permanent;
    rewrite ^/presentations/2018polymorphism/       https://archive.russfeld.me/presentations/interview/ permanent;
    rewrite ^/presentations/kylf_creativity2016/    https://archive.russfeld.me/presentations/kylf_creativity_2016/ permanent;
    rewrite ^/presentations/kylf_creativity/        https://archive.russfeld.me/presentations/kylf_creativity/ permanent;
    rewrite ^/presentations/scratch_hpc/            https://archive.russfeld.me/presentations/scratch_hpc/ permanent;
    rewrite ^/presentations(?:/.*)?$                https://archive.russfeld.me/presentations/ permanent;

    # --- Jekyll-era URLs for content still on this site ------------------------
    location = /cv/ { return 301 /about/cv/; }
    location = /recipes/archive/ { return 301 /recipes/; }
    # Match the client's URI, not nginx's internal index.html lookup.
    if ($request_uri ~ ^/(recipes|projects)/([^/?]+)\.html(?:\?.*)?$) { return 301 /$1/$2/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
